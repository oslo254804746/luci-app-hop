name: LuCI package

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luci-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate package boundary and core manager
        run: ./tests/validate-package.sh

  sdk-package:
    needs: package-structure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-24.10.4-ipk
            release: 24.10.4
            sdk_archive: openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 229e871f734a2cee5ce3ad6a3e98d3836b0899bfdeaea4d9c2c5cc7b1fce1407
            packages_commit: f1470815f41fe199bfdafe9a91ad115bc2e91203
            luci_commit: 75e41cba5160281b2d1dca922719efef29f7ffd8
            extension: ipk
          - name: openwrt-25.12.5-apk
            release: 25.12.5
            sdk_archive: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
            packages_commit: 5caa62e0bc9f7fb9b0c12a23267bceb7724214dd
            luci_commit: 128a7812f4be233c5dd7f7466f534fd888785caf
            extension: apk
    env:
      OPENWRT_RELEASE: ${{ matrix.release }}
      SDK_ARCHIVE: ${{ matrix.sdk_archive }}
      SDK_SHA256: ${{ matrix.sdk_sha256 }}
      OPENWRT_PACKAGES_COMMIT: ${{ matrix.packages_commit }}
      OPENWRT_LUCI_COMMIT: ${{ matrix.luci_commit }}
      PACKAGE_EXTENSION: ${{ matrix.extension }}
    steps:
      - name: Check out LuCI package
        uses: actions/checkout@v4
        with:
          path: luci-app-hop

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang flex bison gawk gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download and verify official SDK
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/x86/64/${SDK_ARCHIVE}"
          wget --quiet "$url"
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_ARCHIVE" | sha256sum --check --strict
          tar --extract --file "$SDK_ARCHIVE"
          mapfile -t sdk_dirs < <(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' -printf '%f\n')
          test "${#sdk_dirs[@]}" -eq 1
          printf 'SDK_DIR=%s/%s\n' "$RUNNER_TEMP" "${sdk_dirs[0]}" >>"$GITHUB_ENV"

      - name: Pin OpenWrt package feeds
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/openwrt/packages.git "$SDK_DIR/feeds/packages"
          git -C "$SDK_DIR/feeds/packages" fetch --depth 1 origin "$OPENWRT_PACKAGES_COMMIT"
          git -C "$SDK_DIR/feeds/packages" checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout \
            https://github.com/openwrt/luci.git "$SDK_DIR/feeds/luci"
          git -C "$SDK_DIR/feeds/luci" fetch --depth 1 origin "$OPENWRT_LUCI_COMMIT"
          git -C "$SDK_DIR/feeds/luci" checkout --detach FETCH_HEAD
          cd "$SDK_DIR"
          ./scripts/feeds update -i packages luci
          ./scripts/feeds install curl ca-bundle luci-base

      - name: Configure lightweight package
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/luci-app-hop" "$SDK_DIR/package/luci-app-hop"
          printf 'CONFIG_PACKAGE_luci-app-hop=m\n' >"$SDK_DIR/.config"
          make -C "$SDK_DIR" defconfig

      - name: Build architecture-independent LuCI package
        run: |
          set -euo pipefail
          make -C "$SDK_DIR" package/luci-app-hop/compile V=sc -j"$(nproc)"

      - name: Record package metadata
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.name }}"
          mkdir -p "$artifact_dir"
          mapfile -d '' packages < <(find "$SDK_DIR/bin/packages" -type f \
            -name "luci-app-hop*.${PACKAGE_EXTENSION}" -print0)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" "$artifact_dir/"
          package_name=$(basename "${packages[0]}")
          if [ "$PACKAGE_EXTENSION" = ipk ]; then
            case "$package_name" in
              *_all.ipk) ;;
              *) echo "IPK is not architecture-independent: $package_name" >&2; exit 1 ;;
            esac
          fi
          (cd "$artifact_dir" && sha256sum "$package_name" >SHA256SUMS)
          file "$artifact_dir/$package_name" >"$artifact_dir/FILE-TYPE"
          stat --printf='%n %s bytes\n' "$artifact_dir/$package_name" >"$artifact_dir/SIZE"
          git -C "$SDK_DIR/feeds/packages" rev-parse HEAD >"$artifact_dir/OPENWRT_PACKAGES_COMMIT"
          git -C "$SDK_DIR/feeds/luci" rev-parse HEAD >"$artifact_dir/OPENWRT_LUCI_COMMIT"

      - name: Upload validation package
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-hop-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
