listen = "0.0.0.0:2222"
data_dir = "/var/lib/hop"

[api]
enabled = true
listen = "127.0.0.1:8083"
token = "change-me"
cors_allowlist = []

[ssh]
host_key_type = "ed25519"
banner = "Welcome to Hop"
keepalive_interval = 30
connect_timeout = 10
proxy_policy = "assets_only"

[runtime]
temp_dir = "/tmp/hop"
log_level = "info"
session_retention_days = 30
